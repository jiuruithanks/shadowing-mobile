<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111714" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>跟读播放 · 東京シャドーイング</title>
    <link rel="icon" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./mobile.css?v=20260914-02" />
    <link rel="stylesheet" href="./mobile-player.css?v=20260915-04" />
  </head>
  <body class="player-page">
    <header class="player-header">
      <a class="player-back" href="./mobile.html" aria-label="返回项目列表" title="返回项目列表">‹</a>
      <div class="player-heading">
        <strong id="seriesTitle">手机跟读</strong>
        <span id="episodeTitle">正在载入</span>
      </div>
      <button id="fullscreenButton" class="player-header-button" type="button" aria-label="全屏" title="全屏">⛶</button>
    </header>

    <main id="playerLayout" class="player-layout">
      <section id="playerShell" class="player-shell" aria-label="视频播放器">
        <video id="video" playsinline preload="metadata"></video>
        <div id="subtitleOverlay" class="subtitle-overlay" aria-live="off">
          <div id="overlayJapanese" class="overlay-japanese"></div>
          <div id="overlayChinese" class="overlay-chinese"></div>
        </div>
        <div id="playerControls" class="player-controls">
          <div class="timeline-row">
            <span id="currentTime">0:00</span>
            <input id="timeline" type="range" min="0" max="100" value="0" step="0.01" aria-label="播放进度" />
            <span id="duration">0:00</span>
            <button id="controlsPinButton" class="pin-button" type="button" aria-pressed="false">常驻</button>
          </div>
          <div class="control-row">
            <button id="backButton" class="control-button" type="button" aria-label="后退 1 秒" title="后退 1 秒">↶<small>1</small></button>
            <button id="playButton" class="play-button" type="button" aria-label="播放" title="播放">▶</button>
            <button id="forwardButton" class="control-button" type="button" aria-label="前进 1 秒" title="前进 1 秒">↷<small>1</small></button>
            <button id="repeatButton" class="mode-button" type="button" aria-pressed="false">单句循环</button>
            <div id="speedControl" class="speed-control">
              <button id="speedButton" class="speed-button" type="button" aria-label="播放速度" aria-haspopup="listbox" aria-expanded="false">1.0×</button>
              <div id="speedMenu" class="speed-menu" role="listbox" aria-label="选择播放速度" hidden>
                <button type="button" role="option" data-speed="1" aria-selected="true">1.0×</button>
                <button type="button" role="option" data-speed="0.9" aria-selected="false">0.9×</button>
                <button type="button" role="option" data-speed="0.8" aria-selected="false">0.8×</button>
                <button type="button" role="option" data-speed="0.7" aria-selected="false">0.7×</button>
                <button type="button" role="option" data-speed="0.6" aria-selected="false">0.6×</button>
                <button type="button" role="option" data-speed="0.5" aria-selected="false">0.5×</button>
              </div>
            </div>
            <label class="auto-next-control player-auto-next">
              <input id="autoNext" type="checkbox" aria-label="自动下一集" />
              <span>下一集</span>
            </label>
          </div>
        </div>
      </section>

      <div
        id="paneResizer"
        class="pane-resizer"
        role="separator"
        aria-label="调整视频和字幕宽度"
        aria-orientation="vertical"
        aria-valuemin="30"
        aria-valuemax="70"
        aria-valuenow="44"
        tabindex="0"
      ><span aria-hidden="true"></span></div>

      <section class="transcript-panel" aria-label="字幕">
        <div id="transcriptList" class="transcript-list"></div>
      </section>
    </main>

    <section id="playerError" class="player-error" hidden role="alert">
      <strong>无法打开这一集</strong>
      <p id="playerErrorMessage"></p>
      <a class="button-primary" href="./mobile.html">返回项目列表</a>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="./mobile-player.js?v=20260915-04" defer></script>
  </body>
</html>
